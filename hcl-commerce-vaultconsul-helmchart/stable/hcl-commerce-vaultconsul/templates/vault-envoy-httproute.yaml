{{- if $.Values.gateway.enabled -}}
{{- $gatewayName := printf "vault-%s-gateway" .Values.common.tenant -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-{{ .Values.common.tenant }}-httproute
  namespace: {{ $.Release.Namespace }}
  labels:
    group: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: {{ $gatewayName }}
    sectionName: vault
  hostnames:
  - {{ .Values.common.subDomain }}.{{ include "external.domain" . }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: vault-consul
      port: 8200
{{- end }}
