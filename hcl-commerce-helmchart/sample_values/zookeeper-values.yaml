##
# This values yaml file provide override values to deploy bitnami zookeeper helm chart 
# for HCL Commerce
#   - chart version: 13.8.5
#   - zookeeper app version: 3.9.3
# 
# To Deploy zookeeper using this sample values
# 1. Create a namespace
#    kubectl create ns zookeeper
# 2. Add helm repo
#    helm repo add bitnami https://charts.bitnami.com/bitnami
# 3. Deploy zookeeper using this override values
#    helm install my-zookeeper bitnami/zookeeper -n zookeeper -f zookeeper-values.yaml --version "13.8.5"
# 4. Monitor deployment until all pods are healthy
# 
# To get the complete values.yaml file, please visit 
#   https://github.com/bitnami/charts/blob/zookeeper/13.8.5/bitnami/zookeeper/values.yaml
#
# To get more information related to this version of zookeeper helm chart, please visit
#   https://github.com/bitnami/charts/blob/zookeeper/13.8.5/bitnami/zookeeper/README.md
#
# Important change for xlinux:
#  Due to changes in the Bitnami public catalog, the Bitnami ZooKeeper image
#  zookeeper:3.9.3-debian-12-r19 has been moved to the "bitnamilegacy" repository.
#  To avoid unexpected changes or potential availability issues, customers are strongly recommended to:
#   Pull and store this image in their own private container registry (e.g., internal Docker repository)
#   Reference the image from their private registry instead of relying on the public bitnamilegacy source.
##
image:
  registry: docker.io
  repository: bitnamilegacy/zookeeper
  tag: 3.9.3-debian-12-r19
fullnameOverride: "hcl-commerce-zookeeper"
replicaCount: 1
maxClientCnxns: 120
## @param nodeSelector Node labels for pod assignment
## Ref: https://kubernetes.io/docs/user-guide/node-selection/
##
nodeSelector: {}
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1024Mi