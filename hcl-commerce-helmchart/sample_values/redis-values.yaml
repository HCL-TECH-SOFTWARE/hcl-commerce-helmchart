##
# This values yaml file provide override values to deploy bitnami redis helm chart 
# for HCL Commerce
#   - chart version: 22.0.7
#   - redis app version: 8.2.1
# 
# To Deploy redis using this sample values
# 1. Create a namespace
#    kubectl create ns redis
# 2. Add helm repo
#    helm repo add bitnami https://charts.bitnami.com/bitnami
# 3. Deploy Redis using this override values
#    helm install my-redis bitnami/redis -n redis -f redis-values.yaml --version "22.0.7"
# 4. Monitor deployment until all pods are healthy
# 
# To get the complete values.yaml file, please visit 
#   https://github.com/bitnami/charts/blob/redis/22.0.7/bitnami/redis/values.yaml

#
# To get more information related to this version of redis helm chart, please visit
#   https://github.com/bitnami/charts/blob/redis/22.0.7/bitnami/redis/README.md
##
architecture: standalone
fullnameOverride: "hcl-commerce-redis"
replica:
  replicaCount: 0
##
# CAUTION: MAJOR CHANGE IN COMMERCE 9.1.20.0+ for xlinux redis:
#  Starting from HCL Commerce version 9.1.20.0, xLinux customers must build the Redis Bitnami Docker image themselves.
#  Follow the instructions in the Knowledge Center to build the image,
#   then update REDIS IMAGE to reference the custom-built image.
#  The certified version is Bitnami Redis 8.4.1-debian-12-r1 for 9.1.20.0.
##
image:
  registry: yourdocker.io
  repository: bitnami/redis
  tag: 8.4.1-debian-12-r1
  pullPolicy: IfNotPresent
auth:
  enabled: false
networkPolicy:
  enabled: false
serviceAccount:
  create: false
  name: "default"
master:
  disableCommands: []
  serviceAccount:
    create: false
    name: "default"
  persistence:
    enabled: false
  ## @param master.nodeSelector Node labels for Redis&reg; master pods assignment
  ## ref: https://kubernetes.io/docs/user-guide/node-selection/
  ##
  nodeSelector: {}
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 4Gi
  configuration: |-
    appendonly no
    save ""
    maxmemory 3000mb
    maxmemory-policy volatile-lru