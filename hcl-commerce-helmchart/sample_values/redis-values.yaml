##
# This values yaml file provide override values to deploy bitnami redis helm chart 
# for HCL Commerce
#   - chart version: 27.0.12
#   - redis app version: 8.8.0
# 
# To Deploy redis using this sample values
# 1. Create a namespace
#    kubectl create ns redis
# 2. Add helm repo
#    helm repo add bitnami https://charts.bitnami.com/bitnami
# 3. Deploy Redis using this override values
#    helm install my-redis bitnami/redis -n redis -f redis-values.yaml --version "27.0.12"
# 4. Monitor deployment until all pods are healthy
# 
# To get the complete values.yaml file, please check redis-27.0.12.tgz included in the charts folder
#
# To get more information related to this version of redis helm chart, please check README.md file in redis-27.0.12.tgz under charts folder
##
architecture: standalone
fullnameOverride: "hcl-commerce-redis"
replica:
  replicaCount: 0
##
# CAUTION: MAJOR CHANGE IN COMMERCE 9.1.20.0+ for xlinux redis:
#  Starting from HCL Commerce version 9.1.20.0, xLinux customers must build the Redis Bitnami Docker image themselves.
#  Follow the instructions in the Knowledge Center to build the image,
#   then update REDIS IMAGE to reference the custom-built image.
#  The certified version is Bitnami Redis 8.8.0-debian-12-r3 for 9.1.21.0.
##
# As of August 28, 2025, the Bitnami public catalog will change to a new repository and move older releases to a legacy repository. Please download Build your own Bitnami images to your own Docker repository and update image registry, repository accordingly.
image:
  registry: yourdocker.io
  repository: bitnami/redis
  tag: 8.8.0-debian-12-r3
  pullPolicy: IfNotPresent
global:
  security:
    allowInsecureImages: true
auth:
  enabled: false
networkPolicy:
  enabled: false
serviceAccount:
  create: false
  name: "default"
master:
  disableCommands: []
  serviceAccount:
    create: false
    name: "default"
  persistence:
    enabled: false
  ## @param master.nodeSelector Node labels for Redis&reg; master pods assignment
  ## ref: https://kubernetes.io/docs/user-guide/node-selection/
  ##
  nodeSelector: {}
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 4Gi
  configuration: |-
    appendonly no
    save ""
    maxmemory 3000mb
    maxmemory-policy volatile-lru
