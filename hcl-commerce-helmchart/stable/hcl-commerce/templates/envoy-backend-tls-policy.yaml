{{/* --- ts-web BackendTLSPolicy --- */}}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ $tenant }}{{ $envName }}{{ $envType }}-ts-web-backend-tls
  namespace: {{ $.Release.Namespace }}
  labels:
    app: HCL-Commerce
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "-" }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    group: {{ $tenant }}{{ $envName }}{{ $envType }}
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: {{ $tenant }}{{ $envName }}{{ $envType }}ts-web
  validation:
    caCertificateRefs:
    - group: ""
      kind: Secret
      name: {{ $caSecretName }}
    hostname: {{ $tenant }}{{ $envName }}{{ $envType }}ts-web.{{ $.Release.Namespace }}.svc.cluster.local
---
