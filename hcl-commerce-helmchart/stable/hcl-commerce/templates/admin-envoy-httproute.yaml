{{- if $.Values.gateway.enabled -}}
{{- $envTypeList := splitList "," (nospace $.Values.common.environmentType) -}}
{{- $tenant := $.Values.common.tenant -}}
{{- $envName := $.Values.common.environmentName -}}
{{- range $envType := $envTypeList -}}
{{- if ne $envType "share" }}
{{- $gw_conf := $.Values.gateway.admin.auth }}
{{- if eq $envType "live" }}
{{ $gw_conf = $.Values.gateway.admin.live }}
{{- end }}
######################################################
# Licensed Materials - Property of HCL Technologies
#  HCL Commerce
#  (C) Copyright HCL Technologies Limited 1996, 2026
######################################################
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $tenant }}{{ $envName }}{{ $envType }}-admin-httproute
  namespace: {{ $.Release.Namespace }}
  labels:
    app: HCL-Commerce
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "-" }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    group: {{ $tenant }}{{ $envName }}{{ $envType }}
spec:
  parentRefs:
  - name: {{ include "hcl-commerce.gateway.name" $ }}
    sectionName: {{ $envType }}-admin
  hostnames:
  - {{ tpl ($gw_conf.domain | toString) $ }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ $tenant }}{{ $envName }}{{ $envType }}ts-web
      port: 8002
---
{{- end }}
{{- end }}
{{- end }}
