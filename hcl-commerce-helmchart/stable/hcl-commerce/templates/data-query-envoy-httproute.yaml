{{- if and $.Values.gateway.enabled (eq $.Values.common.searchEngine "elastic") -}}
{{- $envTypeList := splitList "," (nospace $.Values.common.environmentType) -}}
{{- $tenant := $.Values.common.tenant -}}
{{- $envName := $.Values.common.environmentName -}}
{{- $gatewayName := printf "%s%s-commerce-gateway" $tenant $envName -}}
{{- if has "share" $envTypeList }}
{{- $gw_conf := $.Values.gateway.query.data }}
######################################################
# Licensed Materials - Property of HCL Technologies
#  HCL Commerce
#  (C) Copyright HCL Technologies Limited 1996, 2026
######################################################
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $tenant }}{{ $envName }}-data-query-httproute
  namespace: {{ $.Release.Namespace }}
  labels:
    app: HCL-Commerce
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "-" }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
spec:
  parentRefs:
  - name: {{ $gatewayName }}
    sectionName: share-data-query
  hostnames:
  - {{ tpl ($gw_conf.domain | toString) $ }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ $tenant }}{{ $envName }}query-app
      port: 30901
{{- end }}
{{- end }}
