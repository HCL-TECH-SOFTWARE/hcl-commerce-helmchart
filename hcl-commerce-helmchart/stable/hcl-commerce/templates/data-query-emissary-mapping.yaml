{{- if and ($.Values.ingress.enabled) (eq $.Values.common.searchEngine "elastic") (eq (include "hcl-commerce.hasIngressController" (list "emissary" .)) "true") -}}
{{- $envTypeList := splitList "," (nospace .Values.common.environmentType) -}}
{{- if has "share" $envTypeList }}
{{- $ingress_conf := $.Values.ingress.query.data }}
apiVersion: getambassador.io/v3alpha1
kind: Host
metadata:
  name: commerce-data-query-host
spec:
  {{- if or $.Values.global.emissaryID $ingress_conf.emissaryClass }}
  ambassador_id: [ '{{ default $.Values.global.emissaryID $ingress_conf.emissaryClass }}' ]
  {{- end }}
  hostname: {{ tpl ($ingress_conf.domain | toString) $ }}
  acmeProvider:
    authority: none
  tlsSecret:
    name: {{ default (printf "%s%sshare-certificate" $.Values.common.tenant $.Values.common.environmentName) ($ingress_conf.tlsSecret) }}
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: commerce-data-query-mapping
spec:
  {{- if or $.Values.global.emissaryID $ingress_conf.emissaryClass }}
  ambassador_id: [ '{{ default $.Values.global.emissaryID $ingress_conf.emissaryClass }}' ]
  {{- end }}
  prefix: /
  hostname: {{ tpl ($ingress_conf.domain | toString) $ }}
  host_regex: false
  case_sensitive: false
  timeout_ms: 10000
  service: http://{{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}query-app:30900
  bypass_auth: true
---
{{- end }}
{{- end }}