{{- if and ($.Values.tsDb.enabled) ($.Values.vaultCA.enabled) ($.Values.tsDb.ssl.enabled) (not $.Values.tsDb.ssl.existingSecret) }}
{{- $envTypeList := splitList "," (nospace .Values.common.environmentType) }}
{{- range $envType := $envTypeList }}
{{- if ne $envType "share" }}
