{{- if and $.Values.gateway.enabled $.Values.orchestrationApp.enabled (eq $.Values.common.searchEngine "solr") -}}
{{- $envTypeList := splitList "," (nospace $.Values.common.environmentType) -}}
{{- $tenant := $.Values.common.tenant -}}
{{- $envName := $.Values.common.environmentName -}}
{{- range $envType := $envTypeList -}}
{{- if ne $envType "share" }}
{{- $gw_conf := $.Values.gateway.orchestration.auth }}
{{- $rs_domain := $.Values.gateway.reactstore.auth.domain }}
{{- if eq $envType "live" }}
{{ $gw_conf = $.Values.gateway.orchestration.live }}
{{ $rs_domain = $.Values.gateway.reactstore.live.domain }}
{{- end }}
{{- if or (not $.Values.storeWeb.enabled) (ne $gw_conf.domain $rs_domain) }}
######################################################
# Licensed Materials - Property of HCL Technologies
#  HCL Commerce
#  (C) Copyright HCL Technologies Limited 1996, 2026
######################################################
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $tenant }}{{ $envName }}{{ $envType }}-orchestration-httproute
  namespace: {{ $.Release.Namespace }}
  labels:
    app: HCL-Commerce
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "-" }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    group: {{ $tenant }}{{ $envName }}{{ $envType }}
spec:
  parentRefs:
  - name: {{ include "hcl-commerce.gateway.name" $ }}
    sectionName: {{ $envType }}-orchestration
  hostnames:
  - {{ tpl ($gw_conf.domain | toString) $ }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /search/resources
    backendRefs:
    - name: {{ $tenant }}{{ $envName }}{{ $envType }}orchestration-app
      port: 19443
---
{{- end }}
{{- end }}
{{- end }}
{{- end }}
