apiVersion: v2
description: HCL Commerce Version 9 Helm Chart
keywords:
  - HCL Commerce V9
name: hcl-commerce
version: 91.21.0
kubeVersion: ">=1.16.0-0"
appVersion: "9.1.21.0"
dependencies:
  - name: zookeeper
    version: 13.8.7
    repository: https://charts.bitnami.com/bitnami
    condition: zookeeper.enabled
  - name: redis
    version: 27.0.12
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
    INDEX_LIMIT: 10
  - name: nfs-server-provisioner
    alias: commercenfs
    repository: https://kvaps.github.io/charts 
    version: 1.3.1
    condition: commercenfs.enabled
  - name: postgresql
    version: 13.1.1
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
