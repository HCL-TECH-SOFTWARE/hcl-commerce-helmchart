######################################################
## This sample DB2 should only be used for non-production environment.
## Please see https://help.hcltechsw.com/commerce/9.1.0/install/tasks/tiginstalldb2overview.html for details
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName}}{{ $envType }}db
  namespace: {{ $.Release.Namespace }}
  labels:
    app: HCL-Commerce
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "-" }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    app.kubernetes.io/name: {{ include "name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  selector:
    matchLabels:
      component: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName}}{{ $envType }}db
      group: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName}}{{ $envType }}
      release: {{ $.Release.Name }}
      chart: {{ $.Chart.Name }}
      heritage: {{ $.Release.Service }}
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        productName: "HCL Commerce"
        productVersion: {{ $.Values.common.productVersion | quote }}
      labels:
        component: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName}}{{ $envType }}db
        group: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName}}{{ $envType }}
        app: HCL-Commerce
        release: {{ $.Release.Name }}
        chart: {{ $.Chart.Name }}
        heritage: {{ $.Release.Service }}
    spec:
      {{- if $.Values.tsDb.nodeSelector }}
      nodeSelector:
{{ toYaml $.Values.tsDb.nodeSelector | indent 8 }}
      {{- else if $.Values.common.nodeSelector }}
      nodeSelector:
{{ toYaml $.Values.common.nodeSelector | indent 8 }}
      {{- end }}
      {{- if $.Values.tsDb.tolerations }}
      tolerations:
{{ toYaml $.Values.tsDb.tolerations | indent 8 }}
      {{- else if $.Values.common.tolerations }}
      tolerations:
{{ toYaml $.Values.common.tolerations | indent 8 }}
      {{- end }}
      affinity:
        nodeAffinity:
           {{- if $.Values.tsDb.nodeLabel }}
           requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: wc-node-select-flag
                  operator: In
                  values:
                  - {{ $.Values.tsDb.nodeLabel }}
           {{- else }}
           requiredDuringSchedulingIgnoredDuringExecution:
           {{- include "nodeAffinityRequiredDuringScheduling" $ | indent 8 }}
           {{- end }}
           preferredDuringSchedulingIgnoredDuringExecution:
           {{- include "nodeAffinityPreferredDuringScheduling" $ | indent 8 }}
      hostNetwork: false
      hostPID: false
      hostIPC: false
      serviceAccountName: {{ $.Values.common.serviceAccountName | default (printf "%s-commerce" $.Release.Name) }}
      {{- if include "image.pull.secret" $ }}
      imagePullSecrets:
        - name: {{ include "image.pull.secret" $ }}
      {{- end }}
      {{- if or ($.Values.tsDb.persistence.enabled) (and (not $.Values.global.sofySandboxContext) ($.Values.tsDb.userScripts.enabled)) (and $.Values.global.sofySandboxContext $.Values.tsDb.demoPack.enabled) ($.Values.tsDb.ssl.enabled) }}
      volumes:
      {{- end }}
      {{- if $.Values.tsDb.persistence.enabled }}
        - name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName}}{{ $envType }}-tsdb-volume
          persistentVolumeClaim:
            {{- if $.Values.tsDb.persistence.existingClaim }}
            claimName: {{ $.Values.tsDb.persistence.existingClaim }}
            {{- else }}
            claimName: {{ $.Release.Name }}-{{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}-tsdb-pvc
            {{- end }}
      {{- end }}
      {{- if and (not $.Values.global.sofySandboxContext) ($.Values.tsDb.userScripts.enabled) }}
        - name: user-scripts
          emptyDir: {}
      {{- end }}
      {{- if and $.Values.global.sofySandboxContext $.Values.tsDb.demoPack.enabled }}
        - name: demopack
          emptyDir: {}
      {{- end }}
      {{- if $.Values.tsDb.ssl.enabled }}
        {{- if $.Values.tsDb.ssl.existingSecret }}
        - name: existed-certs
          secret:
            secretName: {{ $.Values.tsDb.ssl.existingSecret }}
        {{- else if $.Values.vaultCA.enabled}}
        - name: ssl-certs-script
          configMap:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName}}{{ $envType }}db-ssl-script
        {{- end }}
        - name: db-ssl-certs
          emptyDir: {}
      {{- end }}
      initContainers:
      {{- if and ($.Values.vaultCA.enabled) ($.Values.tsDb.ssl.enabled) (not $.Values.tsDb.ssl.existingSecret) }}
      - name: vault-sign-certificates
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        args: ["cp /scripts/vault-sign-certificates.sh /tmp/vault-sign-certificates.sh && chmod +x /tmp/vault-sign-certificates.sh && /tmp/vault-sign-certificates.sh"]
        env:
          - name: "VAULT_TOKEN"
            valueFrom:
              secretKeyRef:
                name: {{ $.Values.common.vaultTokenSecret }}
                key: VAULT_TOKEN
          - name: "ENVIRONMENT"
            value: {{ $.Values.common.environmentName | quote }}
          - name: "TENANT"
            value: {{ $.Values.common.tenant | quote }}
          - name: "ENVTYPE"
            value: {{ $envType | quote }}
          - name: "VAULT_URL"
            value: {{ $.Values.common.vaultUrl | quote }}
          - name: "DOMAIN_NAME"
            value: "{{ $.Release.Namespace }}.svc.cluster.local"
        volumeMounts:
          - name: db-ssl-certs
            mountPath: /certs
          - name: ssl-certs-script
            mountPath: /scripts
      {{- end }}
      {{- if and ($.Values.vaultCA.enabled) ($.Values.tsDb.ssl.enabled) ($.Values.tsDb.ssl.existingSecret) }}
      - name: configure-existed-ssl-secret
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        args: ["cp /existed-certs/server.pem /certs/server.pem && cp /existed-certs/key.pem /certs/key.pem && cp /existed-certs/ca.pem /certs/ca.pem"]
        volumeMounts:
          - name: db-ssl-certs
            mountPath: /certs
          - name: existed-certs
            mountPath: /existed-certs
      {{- end }}
      {{- if and (not $.Values.global.sofySandboxContext) ($.Values.tsDb.userScripts.enabled) }}
      - name: user-script-transfer
        image: "{{ include "image.repo" $ }}{{ $.Values.tsDb.userScripts.initContainer.image }}:{{ $.Values.tsDb.userScripts.initContainer.tag }}"
        {{- if $.Values.common.imagePullPolicy }}
        imagePullPolicy: {{ $.Values.common.imagePullPolicy }}
        {{- end }}
        command: 
{{ toYaml $.Values.tsDb.userScripts.initContainer.command | indent 10 }}
        args:
{{ toYaml $.Values.tsDb.userScripts.initContainer.args | indent 10 }}
        {{- if $.Values.tsDb.userScripts.initContainer.env }}
        env:
          {{- range $key, $value := $.Values.tsDb.userScripts.initContainer.env }}
          - name: {{ $key | quote}}
            value: {{ $value | quote}}
          {{- end }}
        {{- end }}
        volumeMounts:
          - name:  user-scripts
            mountPath: /data
      {{- end }}
      {{- if and $.Values.global.sofySandboxContext $.Values.tsDb.demoPack.enabled }}
      - name: demo-pack-transfer
        image: "{{ $.Values.global.hclPreviewImageRegistry }}/{{ $.Values.tsDb.demoPack.initContainer.image }}:{{ $.Values.tsDb.demoPack.initContainer.tag }}"
        {{- if $.Values.common.imagePullPolicy }}
        imagePullPolicy: {{ $.Values.common.imagePullPolicy }}
        {{- end }}
        command: 
{{ toYaml $.Values.tsDb.demoPack.initContainer.command | indent 10 }}
        args:
{{ toYaml $.Values.tsDb.demoPack.initContainer.args | indent 10 }}
        {{- if $.Values.tsDb.demoPack.initContainer.env }}
        env:
          {{- range $key, $value := $.Values.tsDb.demoPack.initContainer.env }}
          - name: {{ $key | quote}}
            value: {{ $value | quote}}
          {{- end }}
        {{- end }}
        volumeMounts:
          - name:  demopack
            mountPath: /data
      {{- end }}
      {{- if $.Values.tsDb.persistence.enabled }}
      - name: pre-load-db-data
        image: "{{ include "image.repo" $ }}{{ $.Values.tsDb.image }}:{{ $.Values.tsDb.tag }}"
        {{- if $.Values.common.imagePullPolicy }}
        imagePullPolicy: {{ $.Values.common.imagePullPolicy }}
        {{- end }}
        command: ["/bin/bash"]
        args: ["-c", 'if [ ! -f /data/.preload_completed ]; then cp -rp /home/db2inst1/db2inst1/* /data; rc=$?; if [ "$rc" = "0" ]; then echo "Data has been loaded successfully."; touch /data/.preload_completed; else echo "Failed to load data."; fi; exit $rc; else echo "Skip loading data."; exit 0; fi']
        volumeMounts:
          - name:  {{ $.Values.common.tenant }}{{ $.Values.common.environmentName}}{{ $envType }}-tsdb-volume
            mountPath: /data
      {{- end }}
      containers:
      - name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName}}{{ $envType }}db
        image: "{{ include "image.repo" $ }}{{ $.Values.tsDb.image }}:{{ $.Values.tsDb.tag }}"
        {{- if $.Values.common.imagePullPolicy }}
        imagePullPolicy: {{ $.Values.common.imagePullPolicy }}
        {{- end }}
        {{- if $.Values.tsDb.ssl.enabled }}
        command:
          - /bin/bash
          - -c
          - |
            set -e
            echo "[DB2 SSL] Rebuilding DIME SSL keystore using new PEM certificates..."
            cd /SETUP/certs

            echo "[DB2 SSL] Creating PKCS12 bundle from PEM files..."
            openssl pkcs12 -export -in ../vault/certs/server.pem -inkey ../vault/certs/key.pem -name default -out server.p12 -passout pass:ibmkey

            # Remove old SSL keystore files
            rm -f dimekeyfile.kdb dimekeyfile.sth dimekeyfile.rdb dimekeyfile.crl 2>/dev/null || true

            # Create new CMS keystore (for DB2 SSL)
            /home/db2inst1/sqllib/gskit/bin/gsk8capicmd_64 -keydb -create -db dimekeyfile.kdb -pw ibmkey -stash -type cms

            #echo "[DB2 SSL] Importing PKCS12 bundle into CMS keystore..."
            /home/db2inst1/sqllib/gskit/bin/gsk8capicmd_64 -cert -import -file server.p12 -pw ibmkey -type pkcs12 -target dimekeyfile.kdb -target_pw ibmkey -label default

            /home/db2inst1/sqllib/gskit/bin/gsk8capicmd_64 -cert -add -db dimekeyfile.kdb -pw ibmkey -label vault-ca -file ../vault/certs/ca.pem -trust enable

            chown -R db2inst1:db2inst1 /SETUP/certs

            echo "[DB2 SSL] SSL keystore updated successfully. Starting DB2..."

            exec /SETUP/bin/entrypoint.sh start
        {{- end }}
        resources:
{{ toYaml $.Values.tsDb.resources | indent 12 }}
        env:
        - name: "LICENSE"
          value: {{ $.Values.license | quote }}
        - name: "SEARCH_ENGINE"
          value: {{ $.Values.common.searchEngine }}
        {{- if $.Values.common.timezone }}
        - name: "TZ"
          value: {{ $.Values.common.timezone | quote }}
        {{- end }}
{{- if get $.Values.tsDb.envParameters $envType }}
     {{- range $key, $value := get $.Values.tsDb.envParameters $envType }}
        - name: {{ $key | quote }}
          value: {{ $value | quote }}
     {{- end }}
{{- end }}
        securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            runAsUser: 0
            privileged: false
            capabilities:
              drop:
              - all
              add:
              - CHOWN
              - DAC_OVERRIDE
              - FOWNER
              - FSETID
              - KILL
              - SETGID
              - SETUID
              - SETPCAP
              - NET_BIND_SERVICE
              - NET_RAW
              - SYS_CHROOT
              - MKNOD
              - AUDIT_WRITE
              - SETFCAP
              - SYS_RESOURCE
              - IPC_OWNER
              - SYS_NICE
        ports:
        - containerPort: 50000
          name: dbport50000
          protocol: TCP
        - containerPort: 50001
          name: dbport50001
          protocol: TCP
        livenessProbe:
          tcpSocket:
            port: 50000
          initialDelaySeconds: 600
          timeoutSeconds: 300
        readinessProbe:
          tcpSocket:
            port: 50000
        {{- if or ($.Values.tsDb.persistence.enabled) (and $.Values.global.sofySandboxContext $.Values.tsDb.demoPack.enabled) (and (not $.Values.global.sofySandboxContext) ($.Values.tsDb.userScripts.enabled)) ($.Values.tsDb.ssl.enabled) }}
        volumeMounts:
        {{- end }}
        {{- if $.Values.tsDb.persistence.enabled }}
          - name:  {{ $.Values.common.tenant }}{{ $.Values.common.environmentName}}{{ $envType }}-tsdb-volume
            mountPath: /home/db2inst1/db2inst1
        {{- end }}
        {{- if and (not $.Values.global.sofySandboxContext) ($.Values.tsDb.userScripts.enabled) }}
          - name:  user-scripts
            mountPath: /SETUP/user_scripts
        {{- end }}
        {{- if and $.Values.global.sofySandboxContext $.Values.tsDb.demoPack.enabled }}
          - name:  demopack
            mountPath: /SETUP/user_scripts
        {{- end }}
        {{- if $.Values.tsDb.ssl.enabled }}
          - name: db-ssl-certs
            mountPath: /SETUP/vault/certs/
        {{- end }}
{{- end }}
---
{{- end }}
{{- end }}
