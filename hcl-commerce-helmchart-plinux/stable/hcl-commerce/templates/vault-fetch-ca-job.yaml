{{- if and (or (and .Values.ingress.enabled (eq (include "hcl-commerce.hasIngressController" (list "f5-nginx" .)) "true")) .Values.gateway.enabled) (.Values.vaultCA.enabled) (.Values.common.vaultTokenSecret) -}}
{{- $envTypeList := splitList "," (nospace .Values.common.environmentType) -}}
{{- range $envType := $envTypeList }}
