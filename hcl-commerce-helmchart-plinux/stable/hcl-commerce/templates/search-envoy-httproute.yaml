{{- if and $.Values.gateway.enabled (eq $.Values.common.searchEngine "solr") -}}
{{- $envTypeList := splitList "," (nospace $.Values.common.environmentType) -}}
{{- $tenant := $.Values.common.tenant -}}
{{- $envName := $.Values.common.environmentName -}}
{{- $gatewayName := printf "%s%s-commerce-gateway" $tenant $envName -}}
{{- range $envType := $envTypeList -}}
{{- if ne $envType "share" }}
{{- $gw_conf := $.Values.gateway.solrsearch.auth }}
{{- if eq $envType "live" }}
{{ $gw_conf = $.Values.gateway.solrsearch.live }}
{{- end }}
{{- $searchServiceName := printf "%s%s%ssearch-app-master" $tenant $envName $envType }}
{{- if eq $envType "live" }}{{ $searchServiceName = printf "%s%s%ssearch-app-repeater" $tenant $envName $envType }}{{ end }}
######################################################
# Licensed Materials - Property of HCL Technologies
#  HCL Commerce
#  (C) Copyright HCL Technologies Limited 1996, 2026
######################################################
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $tenant }}{{ $envName }}{{ $envType }}-search-httproute
  namespace: {{ $.Release.Namespace }}
  labels:
    app: HCL-Commerce
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "-" }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    group: {{ $tenant }}{{ $envName }}{{ $envType }}
spec:
  parentRefs:
  - name: {{ $gatewayName }}
    sectionName: {{ $envType }}-solrsearch
  hostnames:
  - {{ tpl ($gw_conf.domain | toString) $ }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ $searchServiceName }}
      port: 3738
---
{{- end }}
{{- end }}
{{- end }}
