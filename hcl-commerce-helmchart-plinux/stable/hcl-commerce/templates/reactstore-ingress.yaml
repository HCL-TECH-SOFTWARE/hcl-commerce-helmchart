{{- range $ingress_controller := list "gke" "nginx" -}}
{{- if eq (include "hcl-commerce.hasIngressController" (list $ingress_controller $)) "true" -}}
{{- $ingress_name_suffix := "gke" -}}{{- if eq $ingress_controller "nginx" -}}{{- $ingress_name_suffix = "community-nginx" -}}{{- end -}}
{{- if and ($.Values.ingress.enabled) ($ingress_controller) ($.Values.storeWeb.enabled) (or (eq $.Values.common.searchEngine "elastic") (and ($.Values.orchestrationApp.enabled) (eq $.Values.common.searchEngine "solr"))) -}}
{{- $envTypeList := splitList "," (nospace $.Values.common.environmentType) -}}
{{- range $envType := $envTypeList -}}
{{- if ne $envType "share" }}
{{- $ingress_conf := $.Values.ingress.reactstore.auth }}
{{- if eq $envType "live" }}
{{ $ingress_conf = $.Values.ingress.reactstore.live }}
{{- end }}
apiVersion: {{ $.Values.ingress.apiVersion }}
kind: Ingress
metadata:
  name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}-reactstore-{{ $ingress_name_suffix }}-ingress
  namespace: {{ $.Release.Namespace }}
  annotations:
    ingress.kubernetes.io/secure-backends: "true"
    ingress.kubernetes.io/backend-protocol: "HTTPS"
    {{- if eq $ingress_controller "nginx" }}
    nginx.ingress.kubernetes.io/secure-backends: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    {{- if and $.Values.dx.enabled (get $.Values.dx.namespace $envType) }}
    nginx.ingress.kubernetes.io/proxy-body-size: "800m"
    nginx.org/client-max-body-size: "800m"
    nginx.org/ssl-services: "{{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}store-web,{{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}ts-app{{- if eq $.Values.common.searchEngine "elastic" }},{{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}query-app{{- end }},{{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}ts-web,{{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}tooling-web,{{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}-dx{{- if and $.Values.orchestrationApp.enabled (eq $.Values.common.searchEngine "solr") }},{{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}orchestration-app{{- end }}"
    {{- else }}
    nginx.org/ssl-services: "{{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}store-web,{{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}ts-app{{- if eq $.Values.common.searchEngine "elastic" }},{{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}query-app{{- end }},{{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}ts-web,{{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}tooling-web{{- if and $.Values.orchestrationApp.enabled (eq $.Values.common.searchEngine "solr") }},{{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}orchestration-app{{- end }}"
    {{- end }}
    {{- end }}
    {{- if eq $ingress_controller "gke" }}
    {{- if $.Values.ingress.reactstore.gkeCustomAnnotations }}
{{ toYaml $.Values.ingress.reactstore.gkeCustomAnnotations | indent 4 }}
    {{- end }}
    {{- else }}
    {{- if $.Values.ingress.reactstore.communityNginxCustomAnnotations }}
{{ toYaml $.Values.ingress.reactstore.communityNginxCustomAnnotations | indent 4 }}
    {{- end }}
    {{- end }}
  labels:
    app: HCL-Commerce
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "-" }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    group: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName}}{{ $envType }}
spec:
  {{- if eq $ingress_controller "nginx" }}
  ingressClassName: {{ default "nginx" $ingress_conf.communityNginxClass | quote }}
  {{- else if eq $ingress_controller "gke" }}
  ingressClassName: {{ default "gce" $ingress_conf.gkeClass | quote }}
  {{- end }}
  tls:
  - hosts:
    - {{ tpl ($ingress_conf.domain | toString) $ }}
    secretName: {{ default (printf "%s%s%s-certificate" $.Values.common.tenant $.Values.common.environmentName $envType) ($ingress_conf.tlsSecret) }}
  rules:
  - host: {{ tpl ($ingress_conf.domain | toString) $ }}
    http:
      paths:
      {{- if eq $.Values.ingress.apiVersion "networking.k8s.io/v1beta1" }}
      - path: {{- if eq $ingress_controller "nginx" }} / {{- else if eq $ingress_controller "gke" }} /* {{- end }}
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}store-web
          servicePort: 6443
      - path: {{- if eq $ingress_controller "nginx" }} /wcsstore {{- else if eq $ingress_controller "gke" }} /wcsstore/* {{- end }}
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}store-web
          servicePort: 6443
      - path: {{- if eq $ingress_controller "nginx" }} /hclstore {{- else if eq $ingress_controller "gke" }} /hclstore/* {{- end }}
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}store-web
          servicePort: 6443
      {{- if $.Values.nextjsApp.enabled }}
      - path: {{- if eq $ingress_controller "nginx" }} /api {{- else if eq $ingress_controller "gke" }} /api/* {{- end }}
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}nextjs-app
          servicePort: 3343
      - path: {{- if eq $ingress_controller "nginx" }} /_next {{- else if eq $ingress_controller "gke" }} /_next/* {{- end }}
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}nextjs-app
          servicePort: 3343
      {{- if and ($.Values.metrics.enabled) ($.Values.metrics.serviceMonitor.enabled) }}
      - path: {{- if eq $ingress_controller "nginx" }} /api/metrics {{- else if eq $ingress_controller "gke" }} /api/metrics/* {{- end }}
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}ts-web
          servicePort: 8000
      {{- end }}
      {{- end }}
      - path: {{- if eq $ingress_controller "nginx" }} /wcs {{- else if eq $ingress_controller "gke" }} /wcs/* {{- end }}
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}ts-app
          servicePort: 5443
      {{- if eq $.Values.common.searchEngine "elastic" }}
      - path: {{- if eq $ingress_controller "nginx" }} /search/resources {{- else if eq $ingress_controller "gke" }} /search/resources/* {{- end }}
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}query-app
          servicePort: 30901
      {{- end }}
      {{- if and ($.Values.orchestrationApp.enabled) (eq $.Values.common.searchEngine "solr") }}
      - path: {{- if eq $ingress_controller "nginx" }} /search/resources {{- else if eq $ingress_controller "gke" }} /search/resources/* {{- end }}
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}orchestration-app
          servicePort: 19443
      {{- end }}
      {{- if $.Values.ingress.enableToolingForReactStore }}
      - path: {{- if eq $ingress_controller "nginx" }} /lobtools {{- else if eq $ingress_controller "gke" }} /lobtools/* {{- end }}
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}ts-web
          servicePort: 8000
      - path: {{- if eq $ingress_controller "nginx" }} /tooling {{- else if eq $ingress_controller "gke" }} /tooling/* {{- end }}
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}tooling-web
          servicePort: 7443
      {{- end }}
      - path: {{- if eq $ingress_controller "nginx" }} /rest {{- else if eq $ingress_controller "gke" }} /rest/* {{- end }}
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}ts-web
          servicePort: 8000
      - path: {{- if eq $ingress_controller "nginx" }} /webapp/wcs/preview {{- else if eq $ingress_controller "gke" }} /webapp/wcs/preview/* {{- end }}
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}ts-web
          servicePort: 8006
      {{- if and $.Values.dx.enabled (get $.Values.dx.namespace $envType) }}
      - path: /dx
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}-dx
          servicePort: 443
      - path: /wps
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}-dx
          servicePort: 443
      - path: /hcl
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}-dx
          servicePort: 443
      {{- if and (eq $envType "auth") (get $.Values.dx.namespace "live") }}
      - path: /dx/api/dam
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}live-dx
          servicePort: 443
      {{- end }}
      {{- end }}
      {{- if $.Values.approvalApp.enabled }}
      - path: {{- if eq $ingress_controller "nginx" }} /approvals {{- else if eq $ingress_controller "gke" }} /approvals/* {{- end }}
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}approval-app
          servicePort: 6643
      {{- if not $.Values.ingress.enableManageApprovalPage }}
      - path: /approvals/manage-approval
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}ts-web
          servicePort: 8000
      {{- if eq $ingress_controller "gke" }}
      - path: /approvals/manage-approval/*
        backend:
          serviceName: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}ts-web
          servicePort: 8000
      {{- end }}
      {{- end }}
      {{- end }}
      {{- else if eq $.Values.ingress.apiVersion "networking.k8s.io/v1" }}
      - path: {{- if eq $ingress_controller "nginx" }} / {{- else if eq $ingress_controller "gke" }} /* {{- end }}
        pathType: {{- if eq $ingress_controller "nginx" }} Prefix {{- else if eq $ingress_controller "gke" }} ImplementationSpecific {{- end }}
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}store-web
            port:
              number: 6443
      - path: {{- if eq $ingress_controller "nginx" }} /wcsstore {{- else if eq $ingress_controller "gke" }} /wcsstore/* {{- end }}
        pathType: {{- if eq $ingress_controller "nginx" }} Prefix {{- else if eq $ingress_controller "gke" }} ImplementationSpecific {{- end }}
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}store-web
            port:
              number: 6443
      - path: {{- if eq $ingress_controller "nginx" }} /hclstore {{- else if eq $ingress_controller "gke" }} /hclstore/* {{- end }}
        pathType: {{- if eq $ingress_controller "nginx" }} Prefix {{- else if eq $ingress_controller "gke" }} ImplementationSpecific {{- end }}
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}store-web
            port:
              number: 6443
      {{- if $.Values.nextjsApp.enabled }}
      - path: {{- if eq $ingress_controller "nginx" }} /api {{- else if eq $ingress_controller "gke" }} /api/* {{- end }}
        pathType: {{- if eq $ingress_controller "nginx" }} Prefix {{- else if eq $ingress_controller "gke" }} ImplementationSpecific {{- end }}
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}nextjs-app
            port:
              number: 3343
      - path: {{- if eq $ingress_controller "nginx" }} /_next {{- else if eq $ingress_controller "gke" }} /_next/* {{- end }}
        pathType: {{- if eq $ingress_controller "nginx" }} Prefix {{- else if eq $ingress_controller "gke" }} ImplementationSpecific {{- end }}
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}nextjs-app
            port:
              number: 3343
      {{- if and ($.Values.metrics.enabled) ($.Values.metrics.serviceMonitor.enabled) }}
      - path: {{- if eq $ingress_controller "nginx" }} /api/metrics {{- else if eq $ingress_controller "gke" }} /api/metrics/* {{- end }}
        pathType: {{- if eq $ingress_controller "nginx" }} Prefix {{- else if eq $ingress_controller "gke" }} ImplementationSpecific {{- end }}
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}ts-web
            port:
              number: 8000
      {{- end }}
      {{- end }}
      - path: {{- if eq $ingress_controller "nginx" }} /wcs {{- else if eq $ingress_controller "gke" }} /wcs/* {{- end }}
        pathType: {{- if eq $ingress_controller "nginx" }} Prefix {{- else if eq $ingress_controller "gke" }} ImplementationSpecific {{- end }}
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}ts-app
            port:
              number: 5443
      {{- if eq $.Values.common.searchEngine "elastic" }}
      - path: {{- if eq $ingress_controller "nginx" }} /search/resources {{- else if eq $ingress_controller "gke" }} /search/resources/* {{- end }}
        pathType: {{- if eq $ingress_controller "nginx" }} Prefix {{- else if eq $ingress_controller "gke" }} ImplementationSpecific {{- end }}
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}query-app
            port:
              number: 30901
      {{- end }}
      {{- if and ($.Values.orchestrationApp.enabled) (eq $.Values.common.searchEngine "solr") }}
      - path: {{- if eq $ingress_controller "nginx" }} /search/resources {{- else if eq $ingress_controller "gke" }} /search/resources/* {{- end }}
        pathType: {{- if eq $ingress_controller "nginx" }} Prefix {{- else if eq $ingress_controller "gke" }} ImplementationSpecific {{- end }}
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}orchestration-app
            port:
              number: 19443
      {{- end }}
      {{- if $.Values.ingress.enableToolingForReactStore }}
      - path: {{- if eq $ingress_controller "nginx" }} /lobtools {{- else if eq $ingress_controller "gke" }} /lobtools/* {{- end }}
        pathType: {{- if eq $ingress_controller "nginx" }} Prefix {{- else if eq $ingress_controller "gke" }} ImplementationSpecific {{- end }}
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}ts-web
            port:
              number: 8000
      - path: {{- if eq $ingress_controller "nginx" }} /tooling {{- else if eq $ingress_controller "gke" }} /tooling/* {{- end }}
        pathType: {{- if eq $ingress_controller "nginx" }} Prefix {{- else if eq $ingress_controller "gke" }} ImplementationSpecific {{- end }}
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}tooling-web
            port:
              number: 7443
      {{- end }}
      - path: {{- if eq $ingress_controller "nginx" }} /rest {{- else if eq $ingress_controller "gke" }} /rest/* {{- end }}
        pathType: {{- if eq $ingress_controller "nginx" }} Prefix {{- else if eq $ingress_controller "gke" }} ImplementationSpecific {{- end }}
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}ts-web
            port:
              number: 8000
      - path: {{- if eq $ingress_controller "nginx" }} /webapp/wcs/preview {{- else if eq $ingress_controller "gke" }} /webapp/wcs/preview/* {{- end }}
        pathType: {{- if eq $ingress_controller "nginx" }} Prefix {{- else if eq $ingress_controller "gke" }} ImplementationSpecific {{- end }}
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}ts-web
            port:
              number: 8006
      {{- if and $.Values.dx.enabled (get $.Values.dx.namespace $envType) }}
      - path: /dx/
        pathType: {{- if eq $ingress_controller "nginx" }} Prefix {{- else if eq $ingress_controller "gke" }} ImplementationSpecific {{- end }}
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}-dx
            port:
              number: 443
      - path: /wps/
        pathType: {{- if eq $ingress_controller "nginx" }} Prefix {{- else if eq $ingress_controller "gke" }} ImplementationSpecific {{- end }}
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}-dx
            port:
              number: 443
      - path: /hcl/
        pathType: {{- if eq $ingress_controller "nginx" }} Prefix {{- else if eq $ingress_controller "gke" }} ImplementationSpecific {{- end }}
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}-dx
            port:
              number: 443
      {{- if and (eq $envType "auth") (get $.Values.dx.namespace "live") }}
      - path: /dx/api/dam/
        pathType: {{- if eq $ingress_controller "nginx" }} Prefix {{- else if eq $ingress_controller "gke" }} ImplementationSpecific {{- end }}
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}live-dx
            port:
              number: 443
      {{- end }}
      {{- end }}
      {{- if $.Values.approvalApp.enabled }}
      - path: {{- if eq $ingress_controller "nginx" }} /approvals {{- else if eq $ingress_controller "gke" }} /approvals/* {{- end }}
        pathType: {{- if eq $ingress_controller "nginx" }} Prefix {{- else if eq $ingress_controller "gke" }} ImplementationSpecific {{- end }}
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}approval-app
            port:
              number: 6643
      {{- if not $.Values.ingress.enableManageApprovalPage }}
      - path: /approvals/manage-approval
        pathType: {{- if eq $ingress_controller "nginx" }} Prefix {{- else if eq $ingress_controller "gke" }} ImplementationSpecific {{- end }}
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}ts-web
            port:
              number: 8000
      {{- if eq $ingress_controller "gke" }}
      - path: /approvals/manage-approval/*
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}ts-web
            port:
              number: 8000
      {{- end }}
      {{- end }}
      {{- end }}
      {{- end }}
{{- end }}
---
{{- end }}
{{- end }}
{{- end }}
{{- end }}