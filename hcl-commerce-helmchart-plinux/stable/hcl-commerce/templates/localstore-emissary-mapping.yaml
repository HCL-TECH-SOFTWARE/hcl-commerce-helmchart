{{- if and (.Values.ingress.enabled) ($.Values.common.localStoreEnabled) (eq (include "hcl-commerce.hasIngressController" (list "emissary" .)) "true") -}}
{{- $envTypeList := splitList "," (nospace .Values.common.environmentType) -}}
{{- range $envType := $envTypeList }}
{{- if ne $envType "share" }}
{{- $ingress_conf := $.Values.ingress.localstore.auth }}
{{- if eq $envType "live" }}
{{ $ingress_conf = $.Values.ingress.localstore.live }}
{{- end }}
apiVersion: getambassador.io/v3alpha1
kind: Host
metadata:
  name: commerce-{{ $envType }}-localstore-domain-host
spec:
  {{- if or $.Values.global.emissaryID $ingress_conf.emissaryClass }}
  ambassador_id: [ '{{ default $.Values.global.emissaryID $ingress_conf.emissaryClass }}' ]
  {{- end }}
  hostname: {{ tpl ($ingress_conf.domain | toString) $ }}
  acmeProvider:
    authority: none
  tlsSecret:
    name: {{ default (printf "%s%s%s-certificate" $.Values.common.tenant $.Values.common.environmentName $envType) ($ingress_conf.tlsSecret) }}
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: commerce-{{ $envType }}-localstore-domain-mapping
spec:
  {{- if or $.Values.global.emissaryID $ingress_conf.emissaryClass }}
  ambassador_id: [ '{{ default $.Values.global.emissaryID $ingress_conf.emissaryClass }}' ]
  {{- end }}
  prefix: /
  hostname: {{ tpl ($ingress_conf.domain | toString) $ }}
  host_regex: false
  case_sensitive: false
  timeout_ms: 40000
  service: https://{{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}{{ $envType }}ts-web:8443
  bypass_auth: true
---
{{- end }}
{{- end }}
{{- end }}