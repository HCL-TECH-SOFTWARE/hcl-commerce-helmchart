{{- $envTypeList := splitList "," (nospace .Values.common.environmentType) -}}
{{- if and (.Values.ingress.enabled) (has "share" $envTypeList) (eq $.Values.common.searchEngine "elastic") (.Values.mustgatherApp.enabled) (.Values.ingress.mustgather.enabled) (eq (include "hcl-commerce.hasIngressController" (list "emissary" .)) "true") -}}
{{- $ingress_conf := $.Values.ingress.mustgather }}
apiVersion: getambassador.io/v3alpha1
kind: Host
metadata:
  name: commerce-mustgather-host
spec:
  {{- if or $.Values.global.emissaryID $ingress_conf.emissaryClass }}
  ambassador_id: [ '{{ default $.Values.global.emissaryID $ingress_conf.emissaryClass }}' ]
  {{- end }}
  hostname: {{ tpl ($ingress_conf.domain | toString) $ }}
  acmeProvider:
    authority: none
  tlsSecret:
    name: {{ default (printf "%s%sshare-certificate" $.Values.common.tenant $.Values.common.environmentName) ($ingress_conf.tlsSecret) }}
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: commerce-mustgather-mapping
spec:
  {{- if or $.Values.global.emissaryID $ingress_conf.emissaryClass }}
  ambassador_id: [ '{{ default $.Values.global.emissaryID $ingress_conf.emissaryClass }}' ]
  {{- end }}
  prefix: /
  hostname: {{ tpl ($ingress_conf.domain | toString) $ }}
  host_regex: false
  case_sensitive: false
  timeout_ms: 10000
  service: https://{{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}commerce-mustgather:42021
  bypass_auth: true
---
{{- end }}