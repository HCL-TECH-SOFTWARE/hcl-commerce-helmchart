{{- $envTypeList := splitList "," (nospace .Values.common.environmentType) -}}
{{- if and (.Values.ingress.enabled) (has "share" $envTypeList) (eq $.Values.common.searchEngine "elastic") (.Values.mustgatherApp.enabled) (.Values.ingress.mustgather.enabled) (eq (include "hcl-commerce.hasIngressController" (list "f5-nginx" .)) "true") -}}
{{- $ingress_conf := $.Values.ingress.mustgather }}
apiVersion: {{ $.Values.ingress.apiVersion }}
kind: Ingress
metadata:
  name: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}mustgather-f5-nginx-ingress
  namespace: {{ $.Release.Namespace }}
  annotations:
    nginx.org/ssl-services: "{{ $.Values.common.tenant }}{{ $.Values.common.environmentName }}mustgatherApp"
    nginx.org/proxy-buffer-size: "256k"
    nginx.org/proxy-buffers: "16 512k"
    nginx.org/proxy-busy-buffers-size: "512k"
    {{- if $.Values.ingress.mustgather.f5NginxCustomAnnotations }}
{{ toYaml $.Values.ingress.mustgather.f5NginxCustomAnnotations | indent 4 }}
    {{- end }}
  labels:
    app: HCL-Commerce
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "-" }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    group: {{ $.Values.common.tenant }}{{ $.Values.common.environmentName}}
spec:
  ingressClassName: {{ default "f5-nginx" $ingress_conf.f5NginxClass | quote }}
  tls:
  - hosts:
    - {{ tpl ($ingress_conf.domain | toString) $ }}
    secretName: {{ default (printf "%s%sshare-certificate" $.Values.common.tenant $.Values.common.environmentName) ($ingress_conf.tlsSecret) }}
  rules:
  - host: {{ tpl ($ingress_conf.domain | toString) $ }}
    http:
      paths:
      {{- if eq $.Values.ingress.apiVersion "networking.k8s.io/v1beta1" }}
      - path: /
        backend:
          serviceName: {{ .Values.common.tenant }}{{ .Values.common.environmentName }}{{.Values.mustgatherApp.name}}
          servicePort: 42021
      {{- else if eq $.Values.ingress.apiVersion "networking.k8s.io/v1" }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.common.tenant }}{{ .Values.common.environmentName }}{{.Values.mustgatherApp.name}}
            port:
              number: 42021
      {{- end }}
{{- end }}
---
