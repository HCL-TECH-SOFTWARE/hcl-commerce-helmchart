{{- if and $.Values.gateway.enabled $.Values.storeWeb.enabled (or (eq $.Values.common.searchEngine "elastic") (and $.Values.orchestrationApp.enabled (eq $.Values.common.searchEngine "solr"))) -}}
{{- $envTypeList := splitList "," (nospace $.Values.common.environmentType) -}}
{{- $tenant := $.Values.common.tenant -}}
{{- $envName := $.Values.common.environmentName -}}
{{- range $envType := $envTypeList -}}
{{- if ne $envType "share" }}
{{- $gw_conf := $.Values.gateway.reactstore.auth }}
{{- if eq $envType "live" }}
{{ $gw_conf = $.Values.gateway.reactstore.live }}
{{- end }}
######################################################
# Licensed Materials - Property of HCL Technologies
#  HCL Commerce
